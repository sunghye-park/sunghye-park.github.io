    html,

    #card {
      --surface: #ffffff;
      --ink: #000000;
      --line: #e6e6e6;

      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;

      box-sizing: border-box;

      background: var(--surface);
      color: var(--ink);

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    #card.dark {
      --surface: #0f0f0f;
      --ink: #f5f5f5;
      --line: #2a2a2a;
    }

    .panel-title,
    .panel-desc {
      transition: color 0.2s ease;
    }
    .panel-desc {
  width: max-content;
  max-width: none;
  white-space: nowrap;
  flex-shrink: 0;
}

    .panel-title.active,
    .panel-desc.active {
      color: #000000 !important;
    }

    .panel-title:not(.active),
    .panel-desc:not(.active) {
      color: var(--ink);
    }

    .overlay {
      position: absolute;
      inset: 0;

      background: #FCE300;

      clip-path: circle(0px at 0px 0px);

      transition:
        clip-path 0.5s cubic-bezier(0.16, 1, 0.3, 1);

      pointer-events: none;
    }

    .flash {
      position: absolute;

      width: 26px;
      height: 26px;

      margin-left: -13px;
      margin-top: -13px;

      opacity: 0;

      transform: scale(0.3);

      filter: drop-shadow(0 0 10px #ffffff);

      transition:
        opacity 0.28s ease-out,
        transform 0.28s ease-out;

      pointer-events: none;

      z-index: 1;
    }

    #sun,
    #moon {
      position: absolute;
      inset: 0;

      transition: opacity 0.2s ease;
    }

    #moon {
      opacity: 0;
    }

    /* =========================
       MAIN LAYOUT
       ========================= */

      flex-direction: column;
    }

    .empty-space {

    }

    .panels {
      flex: 1 1 0;
      min-height: 0;

      display: flex;

      border-top: 1px solid var(--line);
    }

    .panel {
      position: relative;

      flex: 1 1 50%;
      align-self: stretch;

      min-height: 0;

      overflow: hidden;

      cursor: pointer;

      box-sizing: border-box;

      display: block;

      text-decoration: none;
      color: inherit;
    }

    .panel-content {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100%;

      box-sizing: border-box;

      padding: 68px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .divider {
      width: 1px;
      align-self: stretch;

      background: var(--line);

      flex: none;
    }
   /* Dark mode — yellow panel hover */
#card.dark .panel:hover {
  color: #000000;
}

#card.dark .panel:hover * {

.internship-marquee {
  display: flex;
  align-items: center;
  height: 54px;
  overflow: hidden;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}

.internship-marquee-track {
  display: flex;
  width: max-content;
  animation: internship-scroll 40s linear infinite;
}

.internship-marquee-group {
  display: flex;
  flex: none;
  align-items: center;
  gap: 44px;
  padding-right: 44px;
  white-space: nowrap;
  font-family: 'Anton', sans-serif;
  font-size: 30px;
  text-transform: uppercase;
}

.internship-marquee:hover .internship-marquee-track {
  animation-play-state: paused;
}


@keyframes internship-scroll {
  to {
    transform: translateX(-50%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .internship-marquee-track {
    animation: none;
  }
}

  <script>

    // =========================
    // THEME TOGGLE
    // =========================

   var card = document.getElementById('card');
var sun = document.getElementById('sun');
var moon = document.getElementById('moon');


// 저장되어 있는 테마 불러오기
var savedTheme = localStorage.getItem('theme');

if (savedTheme === 'dark') {
  card.classList.add('dark');

  if (sun) sun.style.opacity = 0;
  if (moon) moon.style.opacity = 1;
}


// 버튼 클릭
document
  .getElementById('theme-btn')
  .addEventListener('click', function () {

    var isDark = card.classList.toggle('dark');

    // 선택 저장
    localStorage.setItem(
      'theme',
      isDark ? 'dark' : 'light'
    );

    if (sun) sun.style.opacity = isDark ? 0 : 1;
    if (moon) moon.style.opacity = isDark ? 1 : 0;

  });



  
    // =========================
    // SPARK HOVER
    // =========================

    function setupPanel(panelId, overlayId, flashId) {

      var panel = document.getElementById(panelId);
      var overlay = document.getElementById(overlayId);
      var flash = document.getElementById(flashId);

      var title = panel.querySelector('.panel-title');
      var desc = panel.querySelector('.panel-desc');

      var flashTimer = null;

      var originX = 0;
      var originY = 0;


      function getRequiredRadius(x, y, width, height) {

        var maxX = Math.max(
          x,
          width - x
        );

        var maxY = Math.max(
          y,
          height - y
        );

        return Math.sqrt(
          maxX * maxX +
          maxY * maxY
        ) + 5;

      }


      function setSpread(radius, x, y, entering) {

        var duration = entering
          ? '0.5s'
          : '0.45s';

        overlay.style.transition =
          'clip-path ' +
          duration +
          ' cubic-bezier(0.16, 1, 0.3, 1)';

        overlay.style.clipPath =
          'circle(' +
          radius +
          'px at ' +
          x +
          'px ' +
          y +
          'px)';

      }


      panel.addEventListener(
        'mouseenter',
        function (e) {

          var rect =
            panel.getBoundingClientRect();


          originX =
            e.clientX - rect.left;

          originY =
            e.clientY - rect.top;


          var requiredRadius =
            getRequiredRadius(
              originX,
              originY,
              rect.width,
              rect.height
            );


          overlay.style.transition = 'none';

          overlay.style.clipPath =
            'circle(0px at ' +
            originX +
            'px ' +
            originY +
            'px)';


          overlay.offsetWidth;


          setSpread(
            requiredRadius,
            originX,
            originY,
            true
          );


          flash.style.left =
            originX + 'px';

          flash.style.top =
            originY + 'px';


          flash.style.opacity = 1;

          flash.style.transform =
            'scale(1)';


          title.classList.add('active');
          desc.classList.add('active');


          if (flashTimer) {
            clearTimeout(flashTimer);
          }


          flashTimer =
            setTimeout(
              function () {

                flash.style.opacity = 0;

                flash.style.transform =
                  'scale(0.3)';

              },
              260
            );

        }
      );


      panel.addEventListener(
        'mouseleave',
        function () {

          setSpread(
            0,
            originX,
            originY,
            false
          );


          title.classList.remove('active');
          desc.classList.remove('active');

        }
      );

    }


    setupPanel(
      'panel-left',
      'overlay-left',
      'flash-left'
    );


    setupPanel(
      'panel-right',
      'overlay-right',
      'flash-right'
    );

  </script>
<script>
  const marquee = document.querySelector('.internship-marquee');
  const groups = marquee.querySelectorAll('.internship-marquee-group');
  const text = 'Open for LIA / Internship - Starting Dec 2026';

  function fillMarquee() {
    const first = groups[0];
    const second = groups[1];

    first.innerHTML = '';
    second.innerHTML = '';

    // 한 묶음이 화면보다 길어질 때까지 문구를 추가
    do {
      const span = document.createElement('span');
      span.textContent = text;
      first.appendChild(span);
    } while (first.scrollWidth < marquee.clientWidth + 300);

    // 똑같은 묶음을 이어 붙여 이음새를 없앰
    second.innerHTML = first.innerHTML;
  }

  fillMarquee();
  window.addEventListener('resize', fillMarquee);
</script>
